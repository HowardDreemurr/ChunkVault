[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunkvault"
version = "0.0.1"
description = "Cross-version incremental backup library for Minecraft Java worlds with chunk-level diff"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Howard Cui"},
]
dependencies = [
    "Pillow>=10.0",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.0",
]

[project.scripts]
chunkvault = "chunkvault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chunkvault"]
include = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
